<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eres mi niña hermosa ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS completo incluido directamente en el archivo */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: url('https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg?semt=ais_hybrid&w=740') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .message {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2);
            font-size: 28px;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 25px;
            animation: bounce 1s infinite;
            transition: transform 0.6s ease;
        }

        .message:hover {
            transform: scale(1.1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .text-bubble {
            position: absolute;
            font-size: 18px;
            font-family: 'Cursive', sans-serif;
            color: #d63384;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: floatText 8s ease-in-out forwards;
            white-space: nowrap;
        }

        @keyframes floatText {
            0% { opacity: 0; transform: scale(0.5) translateY(0px); }
            50% { opacity: 1; transform: scale(1.2) translateY(-50px); }
            100% { opacity: 0; transform: scale(1) translateY(-100px); }
        }

        #bubbles-text {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .message { font-size: 24px; padding: 20px; }
            .text-bubble { font-size: 16px; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div class="message">I Love You ❤️</div>
    <div id="bubbles-text"></div>

    <script>
        // Mensajes que aparecen como burbujas flotantes
        const messages = [
            "Te amo 3 millones ❤️",
            "Gracias por estar en mi vida 🌟",
            "Eres mi persona favorita 💕",
            "Juntos por siempre 🥰",
            "En mi vida solo eres tu mi amor 💖",
            "Tu sonrisa ilumina mi camino 💫",
            "Tu eres mi camino y siempre seras mi camino 😍",
            "Cada momento contigo es mágico ✨",
            "Siempre estas en mi mente 💭",
            "Mi corazón es todo tuyo💘",
            "Te amo en todos los universos ❤️",
            "Yo estoy aqui para hacerte bien mi niña 🌟",
            "Eres la mejor de todo el mundo mi niña 💕",
            "Siempre estare para ti mi niña 🥰",
            "En mi corazóncito solo estas tu 💖",
            "Tus ojitos me encantan demaciado 💫",
            "Yo solo te amo a ti mi niña 😍",
            "Cada uno de los momentos que tenemos juntos son los mejores ✨",
            "Siempre vas a ser dueña de mi mente  💭",
            "Me enamoraste y te entregue todo mi corazón 💘"
        ];

        function createTextBubble() {
            const bubble = document.createElement("div");
            bubble.className = "text-bubble";
            bubble.innerText = messages[Math.floor(Math.random() * messages.length)];

            const left = Math.random() * 80 + 10;
            const top = Math.random() * 80 + 10;

            bubble.style.left = left + "vw";
            bubble.style.top = top + "vh";

            const container = document.getElementById("bubbles-text");
            container.appendChild(bubble);

            setTimeout(() => {
                const rect = bubble.getBoundingClientRect();

                if (rect.right > window.innerWidth) bubble.style.left = `${window.innerWidth - rect.width - 10}px`;
                if (rect.bottom > window.innerHeight) bubble.style.top = `${window.innerHeight - rect.height - 10}px`;
                if (rect.left < 0) bubble.style.left = "10px";
                if (rect.top < 0) bubble.style.top = "10px";
            }, 10);

            setTimeout(() => {
                bubble.remove();
            }, 8000);
        }

        setInterval(createTextBubble, 500);
    </script>
</body>
</html>
